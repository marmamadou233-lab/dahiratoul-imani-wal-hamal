<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Waxtaan - Dahiratoul Imani Wal Hamal</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #071b14;
        color: white;
        min-height: 100vh;
    }

    /* ================= HEADER ================= */

    header {
        background: #0b5d3b;
        padding: 18px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        box-shadow: 0 3px 15px rgba(0,0,0,0.4);
    }

    .logo-zone {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #d8b45a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #071b14;
        font-size: 25px;
    }

    .titre-site {
        font-size: 20px;
        font-weight: bold;
        color: white;
        letter-spacing: 1px;
    }

    /* ================= MENU ================= */

    .menu-button {
        background: transparent;
        border: none;
        color: white;
        font-size: 32px;
        cursor: pointer;
        padding: 5px 10px;
    }

    .menu {
        display: none;
        position: absolute;
        right: 20px;
        top: 78px;
        width: 220px;
        background: #0c2b20;
        border: 1px solid #d8b45a;
        border-radius: 12px;
        overflow: hidden;
        z-index: 1000;
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .menu.active {
        display: block;
    }

    .menu a {
        display: block;
        padding: 15px 18px;
        color: white;
        text-decoration: none;
        border-bottom: 1px solid rgba(216,180,90,0.2);
    }

    .menu a:hover {
        background: #d8b45a;
        color: #071b14;
    }

    /* ================= TITRE ================= */

    .hero {
        text-align: center;
        padding: 45px 20px 30px;
    }

    .hero h1 {
        color: #d8b45a;
        font-size: 38px;
        margin-bottom: 12px;
    }

    .hero p {
        color: #d9e4df;
        font-size: 16px;
    }

    .decoration {
        width: 100px;
        height: 3px;
        background: #d8b45a;
        margin: 20px auto;
        border-radius: 5px;
    }

    /* ================= CONTENU ================= */

    .waxtaan-container {
        width: 92%;
        max-width: 1200px;
        margin: auto;
        padding-bottom: 50px;

        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
    }

    /* ================= CARTE ================= */

    .waxtaan-card {
        background: #102820;
        border: 1px solid rgba(216,180,90,0.45);
        border-radius: 18px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        transition: 0.3s;
    }

    .waxtaan-card:hover {
        transform: translateY(-5px);
        border-color: #d8b45a;
        box-shadow: 0 10px 30px rgba(216,180,90,0.15);
    }

    /* ================= IMAGE ================= */

    .presentateur {
        width: 145px;
        height: 145px;
        object-fit: cover;
        border-radius: 50%;
        display: block;
        margin: 0 auto 18px auto;
        border: 4px solid #d8b45a;

        box-shadow:
            0 0 0 5px rgba(216,180,90,0.08),
            0 0 20px rgba(216,180,90,0.15);
    }

    /* ================= TEXTE ================= */

    .waxtaan-card h2 {
        color: #d8b45a;
        font-size: 23px;
        margin-bottom: 15px;
    }

    .info {
        margin: 8px 0;
        color: #e7eee9;
        line-height: 1.5;
    }

    .info strong {
        color: #d8b45a;
    }

    /* ================= AUDIO ================= */

    audio {
        width: 100%;
        margin-top: 18px;
    }

    /* ================= A VENIR ================= */

    .a-venir {
        display: inline-block;
        margin-top: 18px;
        padding: 9px 18px;
        border: 1px solid #d8b45a;
        border-radius: 20px;
        color: #d8b45a;
        font-weight: bold;
        background: rgba(216,180,90,0.06);
    }

    /* ================= MESSAGE ================= */

    .message {
        grid-column: 1 / -1;
        text-align: center;
        padding: 50px 20px;
        color: #d8b45a;
        font-size: 18px;
    }

    /* ================= FOOTER ================= */

    footer {
        background: #0b5d3b;
        text-align: center;
        padding: 22px;
        color: #e9eee9;
        border-top: 1px solid rgba(216,180,90,0.3);
    }

    footer span {
        color: #d8b45a;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 750px) {

        header {
            padding: 15px;
        }

        .titre-site {
            font-size: 15px;
        }

        .logo {
            width: 42px;
            height: 42px;
            font-size: 21px;
        }

        .hero {
            padding-top: 35px;
        }

        .hero h1 {
            font-size: 30px;
        }

        .waxtaan-container {
            grid-template-columns: 1fr;
            width: 94%;
        }

        .waxtaan-card {
            padding: 22px;
        }

        .presentateur {
            width: 130px;
            height: 130px;
        }

        .menu {
            right: 10px;
            top: 70px;
        }

    }

</style>

</head><body><!-- ================= HEADER ================= -->

<header>

    <div class="logo-zone">

        <div class="logo">
            ☪
        </div>

        <div class="titre-site">
            DAHIRATOUL IMANI WAL HAMAL
        </div>

    </div>


    <button class="menu-button" onclick="ouvrirMenu()">
        ☰
    </button>


    <div class="menu" id="menu">

        <a href="index.html">Accueil</a>

        <a href="waxtaan.html">Waxtaan</a>

        <a href="apprentissage.html">Apprentissage</a>

        <a href="Événements.html">Événements</a>

        <a href="bibliotheque.html">Galerie</a>

        <a href="apropos.html">À-propos</a>

        <a href="contact.html">Contact</a>

    </div>

</header>


<!-- ================= TITRE ================= -->

<section class="hero">

    <h1>Waxtaan</h1>

    <div class="decoration"></div>

    <p>
        Écoutez les waxtaan et découvrez les enseignements
        de la Dahiratoul Imani Wal Hamal.
    </p>

</section>


<!-- ================= CONTENU FIREBASE ================= -->

<main class="waxtaan-container" id="waxtaan">

    <div class="message">
        Chargement des waxtaan...
    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026
        <span>DAHIRATOUL IMANI WAL HAMAL</span>
    </p>

</footer>


<!-- ================= FIREBASE ================= -->

<script type="module">

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        query,
        where
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* ================= CONFIGURATION ================= */

    const firebaseConfig = {

        apiKey: "AIzaSyBgPHYlY14j_4nA1Az6aUXcJ5RKDTivk3w",

        authDomain:
            "dahiratoul-imani-wal-hamal.firebaseapp.com",

        projectId:
            "dahiratoul-imani-wal-hamal",

        storageBucket:
            "dahiratoul-imani-wal-hamal.firebasestorage.app",

        messagingSenderId:
            "744325643903",

        appId:
            "1:744325643903:web:35be72376f7d6de578094a",

        measurementId:
            "G-XL626J35BP"

    };


    /* ================= INITIALISATION ================= */

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    /* ================= MENU ================= */

    function ouvrirMenu() {

        document
            .getElementById("menu")
            .classList.toggle("active");

    }

    window.ouvrirMenu = ouvrirMenu;


    /* ================= CHARGER WAXTAAN ================= */

    async function chargerWaxtaan() {

        const conteneur =
            document.getElementById("waxtaan");


        try {

            const q = query(

                collection(db, "contenus"),

                where("type", "==", "waxtaan")

            );


            const resultat =
                await getDocs(q);


            conteneur.innerHTML = "";


            /* ================= AUCUN WAXTAAN ================= */

            if (resultat.empty) {

                conteneur.innerHTML = `

                    <div class="message">

                        Aucun waxtaan disponible
                        pour le moment.

                    </div>

                `;

                return;

            }


            /* ================= AFFICHAGE ================= */

            let numero = 1;


            resultat.forEach((documentFirebase) => {

                const contenu =
                    documentFirebase.data();


                const titre =
                    contenu.titre ||
                    "Waxtaan " + numero;


                const theme =
                    contenu.theme ||
                    "À venir";


                const date =
                    contenu.date ||
                    "À venir";


                /* ================= CARTE ================= */

                const carte =
                    document.createElement("div");


                carte.className =
                    "waxtaan-card";


                /* IMAGE */

                const image =
                    document.createElement("img");


                image.className =
                    "presentateur";


                image.src =
                    contenu.image ||
                    "images/presentateur1.jpg";


                image.alt =
                    "Présentateur " + titre;


                /* Si l'image n'existe pas */

                image.onerror = function() {

                    this.src =
                        "images/presentateur1.jpg";

                };


                /* TITRE */

                const h2 =
                    document.createElement("h2");


                h2.textContent =
                    titre;


                /* THEME */

                const themeElement =
                    document.createElement("p");


                themeElement.className =
                    "info";


                themeElement.innerHTML =
                    "<strong>Thème :</strong> " +
                    theme;


                /* DATE */

                const dateElement =
                    document.createElement("p");


                dateElement.className =
                    "info";


                dateElement.innerHTML =
                    "<strong>Date :</strong> " +
                    date;


                /* AJOUT */

                carte.appendChild(image);

                carte.appendChild(h2);

                carte.appendChild(themeElement);

                carte.appendChild(dateElement);


                /* ================= AUDIO ================= */

                if (contenu.audio) {

                    const audio =
                        document.createElement("audio");


                    audio.controls = true;

                    audio.src =
                        contenu.audio;


                    audio.preload =
                        "metadata";


                    carte.appendChild(audio);

                }
                else {

                    const badge =
                        document.createElement("div");


                    badge.className =
                        "a-venir";


                    badge.textContent =
                        "Audio à venir";


                    carte.appendChild(badge);

                }


                conteneur.appendChild(carte);


                numero++;

            });


            /* ================= UN SEUL AUDIO ================= */

            const audios =
                document.querySelectorAll("audio");


            audios.forEach(function(audio) {

                audio.addEventListener(
                    "play",
                    function() {

                        audios.forEach(
                            function(autreAudio) {

                                if (
                                    autreAudio !== audio
                                ) {

                                    autreAudio.pause();

                                }

                            }
                        );

                    }
                );

            });

        }


        catch (erreur) {

            console.error(
                "Erreur Firebase :",
                erreur
            );


            conteneur.innerHTML = `

                <div class="message">

                    Impossible de charger
                    les waxtaan.

                    <br><br>

                    Vérifiez votre connexion
                    à Firebase.

                </div>

            `;

        }

    }


    /* ================= LANCEMENT ================= */

    chargerWaxtaan();

</script>

</body></html>
