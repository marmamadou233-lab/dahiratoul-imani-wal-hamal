<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dahiratoul Imani Wal Hamal</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #003d32;
    }

    .accueil {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #003d32;
    }

    .image-accueil {
        width: 100%;
        height: 100%;

        object-fit: contain;

        display: block;

        user-select: none;
        -webkit-user-drag: none;
    }

    #continuer {
        position: absolute;

        left: 50%;
        bottom: 30px;

        transform: translateX(-50%);

        width: 190px;
        height: 55px;

        border: 2px solid rgba(255, 215, 100, 0.9);
        border-radius: 30px;

        background: rgba(0, 61, 50, 0.90);

        color: #ffd766;

        font-size: 18px;
        font-weight: bold;

        letter-spacing: 0.5px;

        cursor: pointer;

        z-index: 10;

        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);

        transition: 0.2s ease;
    }

    #continuer:hover {
        transform: translateX(-50%) scale(1.03);
        background: rgba(0, 61, 50, 0.96);
    }

    #continuer:active {
        transform: translateX(-50%) scale(0.96);
    }

    @media screen and (max-width: 600px) {

        #continuer {
            width: 165px;
            height: 52px;
            bottom: 30px;
            font-size: 17px;
        }

    }

</style>

</head><body><main class="accueil">

    <img
        src="accueil.png"
        alt="Dahiratoul Imani Wal Hamal"
        class="image-accueil"
    >

    <button id="continuer" type="button">
        Continuer
    </button>

</main>

<script>

    document
        .getElementById("continuer")
        .addEventListener("click", function () {

            window.location.href = "bibliotheque.html";

        });

</script>

</body></html>
