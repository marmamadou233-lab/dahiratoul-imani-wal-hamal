<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#06452f">

    <meta name="description"
        content="Dahiratoul Imani Wal Hamal">

    <title>Dahiratoul Imani Wal Hamal</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #031c14;
            font-family: Arial, sans-serif;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* IMAGE D'ACCUEIL */

        .image-accueil {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #031c14;
        }

        /* VOILE LÉGER */

        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.05) 45%,
                    rgba(0, 0, 0, 0.08)
                );

            pointer-events: none;
        }

        /* BOUTON CONTINUER */

        .continuer {
            position: absolute;

            bottom: 45px;
            left: 50%;

            transform: translateX(-50%);

            display: inline-block;

            padding: 15px 42px;

            color: white;
            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            background: rgba(3, 40, 27, 0.88);

            border: 2px solid #d4af37;

            border-radius: 30px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.35);

            transition: 0.3s;

            z-index: 10;
        }

        .continuer:hover {
            background: #06452f;
            color: #d4af37;

            transform:
                translateX(-50%)
                scale(1.03);
        }

        .continuer:active {
            transform:
                translateX(-50%)
                scale(0.97);
        }


        /* PETITS ÉCRANS */

        @media (max-width: 500px) {

            .continuer {
                bottom: 35px;

                padding: 13px 35px;

                font-size: 17px;
            }

        }

    </style>

</head>


<body>

    <div class="page">

        <!-- IMAGE DE BIENVENUE -->

        <img
            src="accueil.png"
            alt="Dahiratoul Imani Wal Hamal"
            class="image-accueil"
        >


        <!-- VOILE -->

        <div class="overlay"></div>


        <!-- BOUTON -->

        <a
            href="accueil.html"
            class="continuer"
        >
            Continuer
        </a>

    </div>


    <!-- ENREGISTREMENT DU SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker.register("service-worker.js")
                    .then(function () {

                        console.log(
                            "Service Worker enregistré"
                        );

                    })
                    .catch(function (erreur) {

                        console.log(
                            "Service Worker non enregistré :",
                            erreur
                        );

                    });

            });

        }

    </script>

</body>

</html>
