<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#031c14">

    <meta name="description"
          content="Dahiratoul Imani Wal Hamal">

    <title>Dahiratoul Imani Wal Hamal</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            background: #031c14;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }


        /* PAGE */

        .page {
            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;

            background: #031c14;
        }


        /* IMAGE */

        .image-accueil {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            object-position: center;

            display: block;

            background: #031c14;
        }


        /* VOILE */

        .overlay {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.08) 50%,
                    rgba(0, 0, 0, 0.55)
                );

            pointer-events: none;
        }


        /* BOUTON CONTINUER */

        .continuer {
            position: absolute;

            left: 50%;

            bottom: 35px;

            transform: translateX(-50%);

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: center;

            min-width: 170px;

            padding: 14px 28px;

            background: rgba(3, 28, 20, 0.92);

            border: 2px solid #d4af37;

            border-radius: 30px;

            color: white;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.4);

            -webkit-tap-highlight-color: transparent;

            transition: 0.2s;
        }


        .continuer:hover {
            background: #06452f;

            color: #d4af37;
        }


        .continuer:active {
            transform:
                translateX(-50%)
                scale(0.96);
        }


        /* TÉLÉPHONE */

        @media (max-width: 600px) {

            .image-accueil {
                object-fit: contain;
            }


            .continuer {
                bottom: 25px;

                min-width: 155px;

                padding: 13px 25px;

                font-size: 16px;
            }

        }


        /* ÉCRAN TRÈS PETIT */

        @media (max-height: 600px) {

            .continuer {
                bottom: 15px;

                padding: 10px 22px;
            }

        }

    </style>

</head>


<body>


    <main class="page">


        <!-- IMAGE D'ACCUEIL -->

        <img
            src="accueil.png"
            alt="Dahiratoul Imani Wal Hamal"
            class="image-accueil"
        >


        <!-- VOILE -->

        <div class="overlay"></div>


        <!-- BOUTON -->

        <a
            href="accueil.html"
            class="continuer"
        >
            Continuer
        </a>


    </main>


    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(function () {

                            console.log(
                                "Service Worker activé"
                            );

                        })
                        .catch(function (erreur) {

                            console.log(
                                "Service Worker :",
                                erreur
                            );

                        });

                }
            );

        }

    </script>


</body>

</html>
