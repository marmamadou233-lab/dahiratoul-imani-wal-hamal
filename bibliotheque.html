<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galerie - Dahiratoul Imani Wal Hamal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            height: 70px;
            background: #0b5d3b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            position: relative;
        }

        header h1 {
            font-size: 18px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .menu {
            display: none;
            position: absolute;
            top: 70px;
            right: 10px;
            width: 230px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 100;
            overflow: hidden;
        }

        .menu.active {
            display: block;
        }

        .menu a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #222;
            border-bottom: 1px solid #eee;
        }

        .menu a:hover {
            background: #e8f5ee;
            color: #0b5d3b;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 30px 15px;
        }

        .titre {
            text-align: center;
            color: #0b5d3b;
            font-size: 28px;
            margin-bottom: 25px;
        }

        .galerie {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .photo {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .photo img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .photo p {
            text-align: center;
            padding: 12px;
            color: #555;
        }

        .vide {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            margin-top: 20px;
            color: #777;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 500px) {
            .galerie {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>DAHIRATOUL IMANI WAL HAMAL</h1>

    <button class="menu-btn" onclick="ouvrirMenu()">☰</button>

    <nav class="menu" id="menu">
        <a href="index.html">Accueil</a>
        <a href="waxtaan.html">Waxtaan</a>
        <a href="apprentissage.html">Apprentissage</a>
        <a href="evenements.html">Événements</a>
        <a href="galerie.html">Galerie</a>
        <a href="a-propos.html">À-propos</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="container">

    <h2 class="titre">Galerie</h2>

    <div class="galerie">

        <div class="photo">
            <img src="images/photo1.jpg" alt="Photo de la Dahira">
            <p>Activité de la Dahira</p>
        </div>

        <div class="photo">
            <img src="images/photo2.jpg" alt="Photo de la Dahira">
            <p>Rencontre</p>
        </div>

        <div class="photo">
            <img src="images/photo3.jpg" alt="Photo de la Dahira">
            <p>Waxtaan</p>
        </div>

        <div class="photo">
            <img src="images/photo4.jpg" alt="Photo de la Dahira">
            <p>Moment de partage</p>
        </div>

    </div><div class="vide">
        <p>Plus de photos seront ajoutées prochainement.</p>
    </div>

</div>

<footer>
    © 2026 Dahiratoul Imani Wal Hamal
</footer>

<script>
    function ouvrirMenu() {
        document.getElementById("menu").classList.toggle("active");
    }
</script>

</body>
</html>
