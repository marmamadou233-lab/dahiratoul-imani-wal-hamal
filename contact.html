<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Dahiratoul Imani Wal Hamal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #075e54;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        .contact-box {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .contact-box h2 {
            margin-bottom: 15px;
            color: #075e54;
        }

        .contact-box p {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .numero {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .whatsapp {
            display: inline-block;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .whatsapp:hover {
            transform: scale(1.05);
        }

        .retour {
            display: block;
            margin-top: 25px;
            color: #075e54;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>DAHIRATOUL IMANI WAL HAMAL</h1>
        <p>Contactez-nous</p>
    </header>

    <div class="container">

        <div class="contact-box">

            <h2>📞 Contact</h2>

            <p>Pour toute information ou question, vous pouvez nous contacter sur WhatsApp.</p>

            <div class="numero">
                📱 +221 77 890 48 41
            </div>

            <a class="whatsapp"
               href="https://wa.me/221778904841"
               target="_blank">
                💬 Contacter sur WhatsApp
            </a>

            <a class="retour" href="index.html">
                ← Retour à l'accueil
            </a>

        </div>

    </div>

</body>

</html>
