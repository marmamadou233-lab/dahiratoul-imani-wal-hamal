<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dahiratoul Imani Wal Hamal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at center, #08734f, #003d2c 75%);
            color: white;
            padding-bottom: 30px;
        }

        /* CADRE PRINCIPAL */

        .page {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        /* BOUTON MENU */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-button {
            width: 60px;
            height: 60px;

            border: 2px solid #e8c65b;
            border-radius: 50%;

            background: rgba(0, 50, 35, 0.8);
            color: white;

            font-size: 32px;
            cursor: pointer;

            position: relative;
            z-index: 1002;
        }

        .top-button:hover {
            background: rgba(220, 180, 60, 0.25);
        }

        /* TITRE */

        .titre {
            text-align: center;
            margin-top: 10px;
        }

        .titre h1 {
            font-family: Georgia, serif;
            font-size: 48px;
            color: white;
            text-shadow: 0 3px 5px #000;
        }

        .titre h2 {
            font-family: Georgia, serif;
            font-size: 42px;
            color: #f1cc57;
            margin-top: 5px;
            text-shadow: 0 3px 5px #000;
        }

        .ligne {
            width: 430px;
            max-width: 80%;
            height: 3px;
            background: #e8c65b;
            margin: 18px auto;
        }

        /* LOGO */

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
        }

        .logo {
            width: 390px;
            height: 390px;
            max-width: 80vw;

            object-fit: contain;

            border-radius: 50%;

            display: block;
        }

        /* TEXTE BIENVENUE */

        .bienvenue {
            text-align: center;
            margin: 10px auto 25px;
        }

        .bienvenue h3 {
            font-family: Georgia, serif;
            font-size: 40px;
            font-style: italic;
            color: white;
        }

        .bienvenue h4 {
            font-family: Georgia, serif;
            font-size: 34px;
            font-style: italic;
            color: #f1cc57;
            margin-top: 5px;
        }

        .bienvenue p {
            font-family: Georgia, serif;
            font-size: 22px;
            font-style: italic;
            margin-top: 15px;
        }

        /* MENU PRINCIPAL */

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 25px;
        }

        .menu-button {
            min-height: 125px;

            border: 2px solid #e8c65b;
            border-radius: 25px;

            background: rgba(0, 75, 50, 0.75);

            color: white;

            display: flex;
            align-items: center;

            text-align: left;

            padding: 15px 25px;

            cursor: pointer;

            transition: 0.2s;

            text-decoration: none;
        }

        .menu-button:hover {
            transform: scale(1.02);
            background: rgba(220, 180, 60, 0.15);
        }

        /* ICÔNES */

        .icone {
            width: 75px;
            height: 75px;
            min-width: 75px;

            border: 2px solid #e8c65b;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;font-size: 38px;
            color: #f5d567;

            margin-right: 20px;
        }

        /* TEXTE DES BOUTONS */

        .texte-menu h5 {
            font-size: 27px;
            margin-bottom: 7px;
        }

        .texte-menu p {
            font-size: 17px;
            color: #eeeeee;
        }

        /* FLÈCHE */

        .fleche {
            margin-left: auto;
            font-size: 38px;
            color: #f5d567;
        }

        /* CITATION */

        .citation {
            max-width: 650px;

            margin: 35px auto 10px;
            padding: 25px 30px;

            border: 2px solid #e8c65b;

            text-align: center;

            font-family: Georgia, serif;
            font-size: 22px;
            font-style: italic;

            line-height: 1.5;

            background: rgba(0, 55, 40, 0.5);
        }


        /* ================================= */
        /* MENU LATERAL */
        /* ================================= */

        .menu-lateral {

            position: fixed;

            top: 0;
            left: -320px;

            width: 300px;
            height: 100vh;

            background: #003d2c;

            border-right: 2px solid #e8c65b;

            padding: 90px 20px 20px;

            z-index: 1001;

            transition: left 0.3s ease;

            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);

            overflow-y: auto;
        }

        .menu-lateral.ouvert {
            left: 0;
        }

        /* TITRE DU MENU */

        .menu-titre {

            text-align: center;

            color: #f1cc57;

            font-family: Georgia, serif;

            font-size: 26px;

            margin-bottom: 25px;
        }

        /* LIENS DU MENU */

        .lien-menu {

            display: flex;

            align-items: center;

            width: 100%;

            min-height: 58px;

            margin-bottom: 12px;

            padding: 10px 15px;

            border: 1px solid #e8c65b;

            border-radius: 15px;

            background: rgba(0, 75, 50, 0.8);

            color: white;

            text-decoration: none;

            font-size: 18px;

            transition: 0.2s;
        }

        .lien-menu:hover {

            background: rgba(220, 180, 60, 0.2);

            transform: translateX(5px);
        }

        .lien-menu span {

            width: 45px;

            font-size: 27px;
        }


        /* FOND SOMBRE */

        .overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100vh;

            background: rgba(0, 0, 0, 0.45);

            display: none;

            z-index: 1000;
        }

        .overlay.ouvert {
            display: block;
        }


        /* RESPONSIVE TÉLÉPHONE */

        @media screen and (max-width: 700px) {

            .page {
                padding: 12px;
            }

            .top-button {

                width: 50px;
                height: 50px;

                font-size: 26px;
            }

            .titre h1 {
                font-size: 30px;
            }

            .titre h2 {
                font-size: 27px;
            }

            .logo {

                width: 280px;
                height: 280px;
            }

            .bienvenue h3 {
                font-size: 27px;
            }

            .bienvenue h4 {
                font-size: 24px;
            }

            .bienvenue p {
                font-size: 18px;
            }

            .menu {

                grid-template-columns: 1fr;

                gap: 12px;
            }

            .menu-button {

                min-height: 105px;

                padding: 12px 15px;
            }

            .icone {

                width: 62px;
                height: 62px;
                min-width: 62px;

                font-size: 30px;

                margin-right: 14px;
            }

            .texte-menu h5 {
                font-size: 22px;
            }.texte-menu p {
                font-size: 15px;
            }

            .fleche {
                font-size: 30px;
            }

            .citation {
                font-size: 18px;
            }

            .menu-lateral {

                width: 280px;

                left: -300px;
            }
        }

    </style>

</head>

<!-- JAVASCRIPT -->

<script>

    function ouvrir(page) {

        window.location.href = page;

    }


    function menu() {

        const menuLateral =
            document.getElementById("menuLateral");

        const overlay =
            document.getElementById("overlay");

        const bouton =
            document.getElementById("menuButton");


        menuLateral.classList.add("ouvert");

        overlay.classList.add("ouvert");

        bouton.innerHTML = "✕";

    }


    function fermerMenu() {

        const menuLateral =
            document.getElementById("menuLateral");

        const overlay =
            document.getElementById("overlay");

        const bouton =
            document.getElementById("menuButton");


        menuLateral.classList.remove("ouvert");

        overlay.classList.remove("ouvert");

        bouton.innerHTML = "☰";

    }

</script>
