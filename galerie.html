<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galerie - Dahiratoul Imani Wal Hamal</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    height: 70px;
    background: #061f18;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 2px solid #d4af37;
    position: relative;
}

.logo {
    color: #d4af37;
    font-size: 17px;
    font-weight: bold;
}

.menu-btn {
    width: 45px;
    height: 45px;
    background: transparent;
    border: 1px solid #d4af37;
    color: #d4af37;
    border-radius: 8px;
    font-size: 25px;
    cursor: pointer;
}

.menu {
    display: none;
    position: absolute;
    right: 15px;
    top: 70px;
    width: 240px;
    background: #0b3d2e;
    border: 1px solid #d4af37;
    border-radius: 10px;
    overflow: hidden;
    z-index: 100;
}

.menu.active {
    display: block;
}

.menu a {
    display: block;
    padding: 15px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.1);
}

.menu a:hover {
    background: #14543f;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    color: #0b3d2e;
    margin-bottom: 30px;
}

.galerie {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.photo {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.photo img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.photo p {
    text-align: center;
    padding: 15px;
    color: #0b3d2e;
    font-weight: bold;
}

@media (max-width: 600px) {

    .logo {
        font-size: 14px;
    }

    .galerie {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<header>

<div class="logo">
DAHIRATOUL IMANI WAL HAMAL
</div>

<button class="menu-btn" id="menuBtn">☰</button>

<nav class="menu" id="menu">

<a href="waxtaan.html">🕌 Waxtaan</a>

<a href="apprentissage.html">📚 Apprentissage</a>

<a href="evenements.html">📅 Événements</a>

<a href="galerie.html">🖼️ Galerie</a>

<a href="apropos.html">ℹ️ À-propos</a>

<a href="contact.html">📞 Contact</a>

</nav>

</header>


<main>

<h1>Galerie</h1>

<div class="galerie">

    <div class="photo">
        <img src="presentateur1.png" alt="Photo de la Dahira">
        <p>Activité de la Dahira</p>
    </div>

    <div class="photo">
        <img src="presentateur2.png" alt="Photo de la Dahira">
        <p>Rencontre</p>
    </div>

    <div class="photo">
        <img src="presentateur1.png" alt="Photo de la Dahira">
        <p>Waxtaan</p>
    </div>

    <div class="photo">
        <img src="presentateur2.png" alt="Photo de la Dahira">
        <p>Moment de partage</p>
    </div>

</div>

</main>


<script>

document.getElementById("menuBtn")
.addEventListener("click", function() {

    document.getElementById("menu")
    .classList.toggle("active");

});

</script>

</body>

</html>
